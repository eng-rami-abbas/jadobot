<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>عجلة الروليت - Ichancy Yuki</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body id="body-header">
    <input type="hidden" id="has_free_spin" value="False" />
    <input type="hidden" id="hdu" value="يجب أن تشحن اليوم للحصول على تدويرة مجانية" />
    <input type="hidden" id="token" value="" />
    <input type="hidden" id="dom" value="" />
    <input type="hidden" id="wheel" value="0" />
    <input type="hidden" id="preview_mode" value='False' />
    <input type="hidden" id="admin_token" value='' />
    <input type="hidden" id="real_preview_mode" value='False' />

    <script id="wheel-config-data" type="application/json">
    {
        "wheel_border_color": "#ffd154",
        "segment_border_color": "#ffffff",
        "wheel_button_color": "#fa513e",
        "segment_text_font_family": "Cairo",
        "show_trial_spin_button": true,
        "segments": [
            {"code": "cash_5000", "label": "5000 ل.س", "reward_type": "cash", "amount": 5000, "celebrate": true},
            {"code": "bonus_15", "label": "بونص 15%", "reward_type": "bonus", "percent": 15},
            {"code": "gift_ticket", "label": "هدية مفاجئة", "reward_type": "gift"},
            {"code": "none", "label": "حظ أوفر المرة القادمة", "reward_type": "none"},
            {"code": "cash_10000", "label": "10000 ل.س", "reward_type": "cash", "amount": 10000, "celebrate": true},
            {"code": "bonus_25", "label": "بونص 25%", "reward_type": "bonus", "percent": 25},
            {"code": "respin", "label": "لفة مجانية", "reward_type": "respin"},
            {"code": "gift_card", "label": "هدية قيمة", "reward_type": "gift"}
        ]
    }
    </script>

    <!-- ═══ شاشة التحميل ═══ -->
    <div id="casino-loader">
        <div class="cl-bg-glow cl-glow-1"></div>
        <div class="cl-bg-glow cl-glow-2"></div>
        <div class="cl-content">
            <div class="cl-wheel-ring">
                <div class="cl-wheel-inner">
                    <span class="cl-wheel-symbol">🎰</span>
                </div>
                <svg class="cl-ring-svg" viewBox="0 0 100 100">
                    <circle class="cl-ring-track" cx="50" cy="50" r="44"/>
                    <circle class="cl-ring-fill" id="cl-ring-fill" cx="50" cy="50" r="44"
                        stroke-dasharray="276.46" stroke-dashoffset="276.46"/>
                </svg>
            </div>
            <h2 class="cl-title">عجلة الحظ</h2>
            <p class="cl-subtitle">جاري تحضير تجربتك الاحترافية</p>
            <div class="cl-bar-wrap">
                <div class="cl-bar-fill" id="cl-bar-fill"></div>
                <div class="cl-bar-shine"></div>
            </div>
            <div class="cl-percent" id="cl-percent">0%</div>
            <div class="cl-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
        <svg width="0" height="0" style="position:absolute">
            <defs>
                <linearGradient id="clRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#8b6914"/>
                    <stop offset="50%" stop-color="#ffd700"/>
                    <stop offset="100%" stop-color="#d4af37"/>
                </linearGradient>
            </defs>
        </svg>
    </div>

    <!-- ═══ العجلة الرئيسية ═══ -->
    <div id="game">
        <div class="roulette-rim"></div>
        <div class="roulette-bowl"></div>
        <div class="comet-ring"></div>
        <div class="roulette-ball" id="rouletteBall"></div>

        <canvas class="wheel" id="wheelCanvas" width="700" height="700"></canvas>

        <button type="button" class="button button-centered" id="disable" aria-label="تدوير العجلة"></button>

        <p class="clock clock-custom" id="clock">يجب أن تشحن اليوم للحصول على تدويرة مجانية</p>
        <p class="clock_text" id="nxt" type="hidden"></p>
    </div>

    <!-- ═══ زر اللفة التجريبية ═══ -->
    <div id="trial-spin-panel" class="trial-spin-panel" style="display:none;">
        <button type="button" id="trial-spin-btn" class="trial-spin-button">🎯 لفة تجريبية</button>
        <p class="trial-spin-note">
            اللفة التجريبية مخصصة لتجربة العجلة فقط، وليست لعباً حقيقياً ولا يتم صرف أي جائزة عليها.
        </p>
    </div>

    <!-- ═══ النتيجة ═══ -->
    <div id="result_box"></div>
    <canvas id="confetti"></canvas>
    <div id="stop"></div>
    <div class="msg-box" id="msgBox"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="wheel.js"></script>
</body>
</html>
