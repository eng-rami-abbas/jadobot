<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0612" />
  <title>JADO BOT — Roulette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/roulette.css" />
</head>
<body>
  <div id="loader" class="loader">
    <div class="loader-glow"></div>
    <div class="loader-ring"></div>
    <h1 class="loader-title">JADO BOT</h1>
    <p class="loader-sub">جاري تحميل الروليت الفاخر...</p>
    <div class="loader-bar"><span id="loaderBar"></span></div>
  </div>

  <div id="app" class="app hidden">
    <div class="casino-bg"></div>
    <div class="vignette"></div>

    <header class="top-bar">
      <button type="button" id="soundToggle" class="sound-btn" aria-label="الصوت">
        <span class="sound-icon">🔊</span>
        <span class="sound-label">الصوت</span>
      </button>
    </header>

    <main class="stage" id="stage">
      <!-- Vertical showcase wheel -->
      <div class="wheel-assembly" id="wheelAssembly">
        <div class="pointer-gem"></div>
        <canvas id="wheelCanvas" width="720" height="720" aria-hidden="true"></canvas>
        <button type="button" id="spinBtn" class="spin-btn" disabled>
          <span class="spin-text">SPIN</span>
        </button>
      </div>

      <!-- Roulette bowl (appears in spin mode) -->
      <div class="roulette-bowl hidden" id="rouletteBowl">
        <div class="bowl-track"></div>
        <div class="bowl-glow"></div>
      </div>
      <div id="ball" class="metal-ball hidden" aria-hidden="true"></div>

      <p id="statusMsg" class="status-msg"></p>
      <div id="resultPanel" class="result-panel hidden"></div>
    </main>

    <footer class="brand-footer">
      <div class="crown">♛</div>
      <h2 class="brand-name">JADO BOT</h2>
      <div class="brand-ornament"></div>
    </footer>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
