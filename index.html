<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JADO BOT - الروليت الملكي</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- الخلفية والتأثيرات -->
  <div class="bg-layer"></div>
  <div class="glow-overlay"></div>

  <!-- الحاوية الرئيسية -->
  <div class="app-container">
    <!-- منطقة العجلة -->
    <div class="wheel-area">
      <canvas id="wheelCanvas" class="wheel-canvas"></canvas>
      <!-- زر SPIN / الكرة -->
      <div id="spinButton" class="spin-btn">
        <span class="spin-text">SPIN</span>
        <div id="ball" class="ball-hidden"></div>
      </div>
    </div>

    <!-- معلومات المستخدم والرصيد -->
    <div class="user-info">
      <span id="username"></span> |
      <span id="balance">0</span> عملة
    </div>

    <!-- زر كتم الصوت -->
    <button id="muteBtn" class="mute-btn">🔊</button>

    <!-- رسالة النتيجة -->
    <div id="resultMessage" class="result-message hidden"></div>

    <!-- تذييل البوت -->
    <div class="footer">
      <span class="bot-name">JADO BOT</span>
      <div class="footer-glow"></div>
    </div>
  </div>

  <!-- نصوص الأقسام لتُضاف ديناميكياً -->
  <script type="text/template" id="segment-labels">["10000","20000","حظ أوفر","Telegram Premium","50000","Bonus 5%","حظ أوفر","إعادة تدوير"]</script>

  <!-- ملفات الجافاسكريبت -->
  <script src="js/telegram.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
