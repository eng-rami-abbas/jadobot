<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JADO BOT - Premium Roulette</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Background Layer -->
        <div id="bg-layer">
            <img id="bg-image" src="assets/jado.png" alt="JADO Background">
            <div id="bg-blur"></div>
            <div id="bg-glow"></div>
            <div id="bg-rays"></div>
            <div id="bg-particles"></div>
            <div id="bg-depth"></div>
        </div>

        <!-- Canvas Container -->
        <div id="canvas-container">
            <canvas id="wheel-canvas"></canvas>
        </div>

        <!-- Three.js Container -->
        <div id="three-container"></div>

        <!-- UI Overlay -->
        <div id="ui-overlay">
            <!-- Top Bar -->
            <div id="top-bar">
                <div id="user-info">
                    <div id="user-avatar"></div>
                    <div id="user-details">
                        <span id="user-name">JADO User</span>
                        <span id="user-balance">💰 0</span>
                    </div>
                </div>
                <div id="spin-counter">
                    <span id="spins-remaining">🎰 تدويرات: 0</span>
                </div>
            </div>

            <!-- Center Area -->
            <div id="center-area">
                <div id="wheel-wrapper">
                    <div id="wheel-3d"></div>
                    <div id="spin-btn-container">
                        <button id="spin-btn" class="spin-btn">
                            <span class="spin-text">SPIN</span>
                            <div class="spin-shine"></div>
                        </button>
                    </div>
                    <div id="ball-container" style="display:none;">
                        <div id="roulette-ball"></div>
                    </div>
                </div>
            </div>

            <!-- Bottom Area -->
            <div id="bottom-area">
                <div id="jado-branding">
                    <div class="crown-icon">👑</div>
                    <h1 class="jado-title">JADO BOT</h1>
                    <div class="diamond-icon">💎</div>
                </div>
                <div id="message-area">
                    <div id="message-box" class="hidden">
                        <span id="message-text"></span>
                    </div>
                </div>
            </div>

            <!-- Sound Toggle -->
            <button id="sound-toggle" class="sound-btn">
                <span id="sound-icon">🔊</span>
                <span id="sound-text">الصوت</span>
            </button>

            <!-- Loading Overlay -->
            <div id="loading-overlay">
                <div class="loading-spinner"></div>
                <span>جاري التحميل...</span>
            </div>

            <!-- Deposit Required Modal -->
            <div id="deposit-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-icon">💳</div>
                    <h2>إيداع مطلوب</h2>
                    <p>يجب القيام بإيداع أولاً للحصول على تدويرة مجانية.</p>
                    <button id="deposit-btn" class="modal-btn">إيداع الآن</button>
                </div>
            </div>

            <!-- Win Modal -->
            <div id="win-modal" class="modal hidden">
                <div class="modal-content win-content">
                    <div class="win-particles"></div>
                    <div class="modal-icon" id="win-icon">🎉</div>
                    <h2 id="win-title">مبروك!</h2>
                    <p id="win-message"></p>
                    <button id="win-close" class="modal-btn">حسناً</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/telegram.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
