version: '3.8'

services:
  bot:
    build: .
    container_name: ichancy_bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - COOKIE_STRING=${COOKIE_STRING}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - MONGO_URI=${MONGO_URI}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
    volumes:
      - ./database.db:/app/database.db
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - ichancy_network
    depends_on:
      - redis

  admin_panel:
    build: .
    container_name: ichancy_admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - COOKIE_STRING=${COOKIE_STRING}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - MONGO_URI=${MONGO_URI}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
    volumes:
      - ./database.db:/app/database.db
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - ichancy_network
    depends_on:
      - redis
    command: python web_admin/app.py

  redis:
    image: redis:7-alpine
    container_name: ichancy_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ichancy_network
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: ichancy_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - ichancy_network
    depends_on:
      - admin_panel

volumes:
  redis_data:

networks:
  ichancy_network:
    driver: bridge
