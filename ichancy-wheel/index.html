<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>JADO BOT - Premium Roulette</title>

    <!-- CRITICAL: Base tag ensures all relative paths resolve correctly in subfolders -->
    <base href="./">

    <link rel="stylesheet" href="./style.css">

    <!-- CDN Libraries with error handling -->
    <script>
        window.libLoadErrors = [];
        function onLibError(lib) { window.libLoadErrors.push(lib); }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js" onerror="onLibError('supabase')"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" onerror="onLibError('gsap')"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="onLibError('three')"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js" onerror="onLibError('howler')"></script>
    <script src="https://telegram.org/js/telegram-web-app.js" onerror="onLibError('telegram')"></script>

    <style>
        body { margin: 0; background: #0A0A0A; overflow: hidden; font-family: Arial, sans-serif; }
        #loading-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #0A0A0A; z-index: 9999; display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
            color: #FFD700; font-size: 16px;
        }
        .loading-spinner {
            width: 50px; height: 50px; border: 3px solid #333;
            border-top-color: #FFD700; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <span>جاري تحميل JADO BOT...</span>
    </div>

    <div id="app" style="display:none;">
        <!-- Background Layer -->
        <div id="bg-layer">
            <img id="bg-image" src="./assets/jado.png" alt="JADO Background" onerror="this.style.display='none'">
            <div id="bg-blur"></div>
            <div id="bg-glow"></div>
            <div id="bg-rays"></div>
            <div id="bg-particles"></div>
            <div id="bg-depth"></div>
        </div>

        <!-- Three.js Container -->
        <div id="three-container"></div>

        <!-- Canvas Fallback -->
        <canvas id="wheel-canvas" style="display:none;"></canvas>

        <!-- UI Overlay -->
        <div id="ui-overlay">
            <!-- Top Bar -->
            <div id="top-bar">
                <div id="user-info">
                    <div id="user-avatar">J</div>
                    <div id="user-details">
                        <span id="user-name">JADO User</span>
                        <span id="user-balance">💰 0</span>
                    </div>
                </div>
                <div id="spin-counter">
                    <span id="spins-remaining">🎰 تدويرات: 1</span>
                </div>
            </div>

            <!-- Center Area -->
            <div id="center-area">
                <div id="wheel-wrapper">
                    <!-- 2D Canvas Wheel (always works) -->
                    <canvas id="wheel-2d"></canvas>

                    <!-- 3D Wheel Container (optional) -->
                    <div id="wheel-3d-container"></div>

                    <!-- Spin Button -->
                    <div id="spin-btn-container">
                        <button id="spin-btn" class="spin-btn">
                            <span class="spin-text">SPIN</span>
                            <div class="spin-shine"></div>
                        </button>
                    </div>

                    <!-- Ball -->
                    <div id="ball-container" style="display:none;">
                        <div id="roulette-ball"></div>
                    </div>

                    <!-- Pointer/Indicator -->
                    <div id="wheel-pointer">
                        <div class="pointer-triangle"></div>
                    </div>
                </div>
            </div>

            <!-- Bottom Area -->
            <div id="bottom-area">
                <div id="jado-branding">
                    <div class="crown-icon">👑</div>
                    <h1 class="jado-title">JADO BOT</h1>
                    <div class="diamond-icon">💎</div>
                </div>
                <div id="message-area">
                    <div id="message-box" class="hidden">
                        <span id="message-text"></span>
                    </div>
                </div>
            </div>

            <!-- Sound Toggle -->
            <button id="sound-toggle" class="sound-btn">
                <span id="sound-icon">🔊</span>
                <span id="sound-text">الصوت</span>
            </button>
        </div>

        <!-- Modals -->
        <div id="deposit-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-icon">💳</div>
                <h2>إيداع مطلوب</h2>
                <p>يجب القيام بإيداع أولاً للحصول على تدويرة مجانية.</p>
                <button id="deposit-btn" class="modal-btn">إيداع الآن</button>
            </div>
        </div>

        <div id="win-modal" class="modal hidden">
            <div class="modal-content win-content">
                <div class="win-particles"></div>
                <div class="modal-icon" id="win-icon">🎉</div>
                <h2 id="win-title">مبروك!</h2>
                <p id="win-message"></p>
                <button id="win-close" class="modal-btn">حسناً</button>
            </div>
        </div>

        <div id="error-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-icon">⚠️</div>
                <h2>تنبيه</h2>
                <p id="error-message"></p>
                <button id="error-close" class="modal-btn">حسناً</button>
            </div>
        </div>
    </div>

    <!-- Local scripts with ./ paths -->
    <script src="./js/audio.js"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/telegram.js"></script>
    <script src="./js/physics.js"></script>
    <script src="./js/wheel.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
